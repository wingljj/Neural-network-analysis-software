[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-network-analysis-software"
version = "0.1.0"
description = "离线桌面端数据分析与神经网络预测软件"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "PyQt5>=5.15",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0", "pyinstaller-hooks-contrib>=2024.0"]

[project.scripts]
nn-analysis-app = "nn_analysis_app.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
